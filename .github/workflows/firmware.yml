name: Firmware

on:
  pull_request:
    paths:
      - 'firmware/**'
      - 'Makefile'
      - '.github/workflows/firmware.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'Makefile'
      - '.github/workflows/firmware.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firmware/subvendo/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/subvendo/requirements.txt', 'firmware/subvendo/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-
      - name: Install host sim dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev
      - name: Run host sim
        run: make sim
      - name: Install pinned firmware tools
        run: make venv
      - name: Build firmware
        working-directory: firmware/subvendo
        run: .venv/bin/pio run
