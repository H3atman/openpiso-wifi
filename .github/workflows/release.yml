name: Release

# Builds, signs, and publishes a Controller release on main. A merge that touches
# controller/ releases the next version; pushing a vMAJOR.MINOR.PATCH tag releases
# that version. See ADR 0010 and "Cutting a release" in controller/README.md.

on:
  push:
    branches: [main]
    # Path filters apply to branch pushes only; tag pushes always run.
    paths:
      - 'controller/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Never run two releases at once, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A tag push uses its tag. A merge bumps the latest release's patch number,
      # or its minor/major number when the merged PR has a release:minor or
      # release:major label.
      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
            IFS=. read -r major minor patch <<< "${latest#v}"
            labels=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' || true)
            if grep -qx release:major <<< "$labels"; then
              version="v$((${major:-0} + 1)).0.0"
            elif grep -qx release:minor <<< "$labels"; then
              version="v${major:-0}.$((${minor:-0} + 1)).0"
            else
              version="v${major:-0}.${minor:-0}.$((${patch:--1} + 1))"
            fi
          fi
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Require the commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$VERSION ($GITHUB_SHA) is not an ancestor of origin/main; tag a commit on main."
            exit 1
          fi
      - name: Require the release key
        env:
          # Only whether the secret is set reaches this step, never its value.
          HAS_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ ! -s controller/release.pub ]; then
            echo "::error::controller/release.pub is missing; run scripts/release-setup.sh once and commit it."
            exit 1
          fi
          if [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is empty; run scripts/release-setup.sh once."
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - name: Vet
        run: make -C controller check
      - name: Cross-compile
        run: make -C controller cross VERSION="$VERSION"
      - name: Assemble dist
        run: |
          mkdir dist
          cp controller/bin/openpiso-linux-armv7 controller/bin/openpiso-linux-arm64 controller/bin/openpiso-linux-amd64 dist/
          tar -czf dist/openpiso-install.tar.gz -C controller install
      - name: Sign the manifest
        working-directory: controller
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./cmd/releasetool manifest -version "$VERSION" -dir ../dist
      - name: Verify against the committed public key
        working-directory: controller
        run: go run ./cmd/releasetool verify -dir ../dist -pub release.pub
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Upload into a draft first so latest/download/release.json never points at a
      # half-uploaded release; publishing makes it latest in one step. On a merge
      # the tag does not exist yet, so the release creates it at the merged commit.
      - name: Create draft release
        run: |
          gh release create "$VERSION" --draft --generate-notes --target "$GITHUB_SHA" --title "$VERSION" \
            dist/openpiso-linux-armv7 dist/openpiso-linux-arm64 dist/openpiso-linux-amd64 \
            dist/release.json dist/release.json.sig dist/openpiso-install.tar.gz
      - name: Publish release
        run: gh release edit "$VERSION" --draft=false --latest
