; Subvendo bench builds. Run through the venv: .venv/bin/pio run -e <env>
; Pinned: platform espressif8266 4.2.1 -> framework-arduinoespressif8266 3.30102.0 (Arduino core 3.1.2),
; toolchain-xtensa 2.100300.220621 (xtensa GCC 10.3).
;
; Board: KiTifi or JuanFi LAN, unknown which. Pick the preset with BENCH_BOARD_KITIFI (default) or
; BENCH_BOARD_JUANFI; override any single pin with -DCOIN_PIN=.. -DSET_PIN=.. -DETH_CS=.. -DGEN_PIN=..
; and the chip with -DETH_W5100 or -DETH_W5500. See bench/common/bench_pins.h.

[platformio]
src_dir = bench
default_envs = core_target, flash_id, rtc_retention, flash_ring, isr_loopback, provisioning
; Optional, untracked: bench/wifi.local.ini defines [wifi] build_flags (see bench/README.md).
extra_configs = bench/wifi.local.ini*

[env]
platform = espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266 @ 3.30102.0
framework = arduino
board = esp12e
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
; 4 MB flash, 1 MB FS: the FS area starts at flash 0x300000. The bench sketches use no FS and
; borrow 0x300000..0x30FFFF for the flash ring tests. Config owns the separate
; EEPROM sector 0x3FB000, outside OTA and FS updates. Do not use default EEPROM.
; RTC retention journals in the bench scratch sector 0x310000 instead.
; Wrapper asserts the actual linker boundaries match provisioning.h's compile-time guard.
board_build.ldscript = ${PROJECT_DIR}/config.guard.ld
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DBENCH_BOARD_KITIFI
  -I${PROJECT_DIR}/bench/common
  -I${PROJECT_DIR}/lib/subvendo_core

; The core compiled for the target with -Werror, against stub HALs. Build only; nothing to flash.
[env:core_target]
build_src_filter = -<*> +<core_target/>
lib_deps = subvendo_core
build_flags =
  ${env.build_flags}
  -Wall -Wextra -Werror

[env:flash_id]
build_src_filter = -<*> +<flash_id/>

[env:rtc_retention]
build_src_filter = -<*> +<rtc_retention/>
; Uncomment after wiring GPIO16 to RST to include the deep sleep step.
; build_flags = ${env.build_flags} -DRTC_TEST_DEEPSLEEP=1

[env:flash_ring]
build_src_filter = -<*> +<flash_ring/>
lib_deps = subvendo_core

; The WiFi case runs only if bench/wifi.local.ini provides [wifi] build_flags.
[wifi]
build_flags =

[env:isr_loopback]
build_src_filter = -<*> +<isr_loopback/>
build_flags =
  ${env.build_flags}
  ${wifi.build_flags}

; #43 first-contact bench (build only unless Rafael explicitly flashes it).
[env:provisioning]
build_src_filter = -<*> +<provisioning/>
lib_deps = subvendo_core

[env:provisioning_w5500]
extends = env:provisioning
build_flags =
  ${env.build_flags}
  -DETH_W5500
