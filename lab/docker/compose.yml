# The fixed parts of one Docker lab: the Router and the Controller on the lab WAN. The harness starts
# Devices on the lab LAN itself. Run as its own compose project; every name carries ${LAB}.
# Docker's subnets are throwaway: the lab's own addresses (10.77.7.0/24, 10.5.x) run on the same wire.
name: ${LAB}

services:
  router:
    image: ${LAB_IMAGE}
    pull_policy: never
    command: ["/bin/sh", "/lab/router.sh"]
    cap_add: [NET_ADMIN]
    devices: [/dev/kvm, /dev/net/tun]
    ports: ["127.0.0.1::8080", "127.0.0.1::8443"]
    volumes:
      - ${CHR_IMAGE}:/img/chr.img:ro
      - ./router.sh:/lab/router.sh:ro
    networks:
      wan: {interface_name: wan0}
      lan: {interface_name: lan0}

  controller:
    image: ${LAB_IMAGE}
    pull_policy: never
    cap_add: [NET_ADMIN]
    ports: ["127.0.0.1::18080"]
    environment:
      OPENPISO_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ${CONTROLLER_BINARY}:/usr/local/bin/openpiso:ro
    tmpfs: [/data]
    networks:
      wan: {interface_name: eth0}
    # The harness reaches the admin panel through the published port, which arrives from the WAN
    # network's Docker gateway; admit exactly that address. Devices return via the Router, no NAT.
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        gateway=$$(ip route show default | awk '{print $$3}')
        ip addr add 10.77.7.1/24 dev eth0
        ip route add 10.5.0.0/16 via 10.77.7.2
        exec openpiso -listen 0.0.0.0:18080 -data /data -portal-url http://10.77.7.1:18080 -admin-network "$$gateway/32"

networks:
  wan:
    name: ${LAB}-wan
  lan:
    name: ${LAB}-lan
    internal: true
