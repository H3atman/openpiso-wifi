# The dev lab (`lab/dev/dev.py`): compose.yml plus this file, as one long-lived project.
# The repository is mounted read-only at its real path, so the dev-build Controller (which runs from
# there) reads templates and static files from source; the admin panel is on a fixed local port.
services:
  controller:
    ports: !override ["127.0.0.1:${ADMIN_PORT}:18080"]
    volumes:
      - ${SOURCE}:${SOURCE}:ro
