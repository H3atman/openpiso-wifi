<!DOCTYPE html>
<!-- openpiso-phone-portal: wizard replaces __PORTAL__ before uploading this to the CHR -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0; url=http://__PORTAL__/?mac=$(mac-esc)&amp;ip=$(ip)">
<title>Redirecting</title>
<script>location.replace("http://__PORTAL__/?mac=$(mac-esc)&ip=$(ip)");</script>
</head>
<body>
<p><a href="http://__PORTAL__/?mac=$(mac-esc)&amp;ip=$(ip)">Continue to the portal</a></p>
</body>
</html>
